<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <radialGradient id="iconBgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#262630" />
      <stop offset="100%" stop-color="#111116" />
    </radialGradient>
    <linearGradient id="shieldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3856" />
      <stop offset="50%" stop-color="#C6283D" />
      <stop offset="100%" stop-color="#73091B" />
    </linearGradient>
    <filter id="iconGlowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#C6283D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="180" height="180" rx="42" fill="url(#iconBgGrad)" stroke="#383848" stroke-width="2"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M0 45 H180 M0 90 H180 M0 135 H180 M45 0 V180 M90 0 V180 M135 0 V180" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Centered Glowing Shield & 'K' -->
  <g transform="translate(42, 32)" filter="url(#iconGlowDrop)">
    <!-- Hexagonal Shield -->
    <path d="M48 0 L88 20 L88 68 L48 96 L8 68 L8 20 Z" fill="url(#shieldGradIcon)" />
    <!-- Bevel highlight -->
    <path d="M48 6 L82 23 L82 65 L48 88 Z" fill="#FFA3AF" opacity="0.3" />
    
    <!-- Bold Sharp Esports 'K' -->
    <path d="M30 22 H40 V44 L56 22 H68 L50 46 L70 74 H58 L40 49 V74 H30 Z" fill="#FFFFFF" />
    <!-- Sparkle dot -->
    <polygon points="48,12 54,22 48,20 42,22" fill="#FFE082" />
  </g>

  <!-- Rim highlight -->
  <rect x="2" y="2" width="176" height="176" rx="40" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" fill="none"/>
</svg>

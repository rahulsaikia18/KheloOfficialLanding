<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="tropGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#C6283D"/>
    </linearGradient>
    <filter id="tropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C6283D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#tropGlow)">
    <!-- Base Pedestal -->
    <rect x="52" y="128" width="56" height="14" rx="4" fill="#1C1C22" stroke="#33333F"/>
    <rect x="60" y="120" width="40" height="10" rx="2" fill="#282832" stroke="#C6283D" stroke-width="1.5"/>
    <text x="80" y="138" font-family="'Inter'" font-size="7" font-weight="900" fill="#FFE082" text-anchor="middle" letter-spacing="1">CHAMPION</text>

    <!-- Stem -->
    <path d="M74 94 L86 94 L83 120 L77 120 Z" fill="url(#tropGold)"/>

    <!-- Handles -->
    <path d="M52 48 C30 50, 30 78, 56 82" stroke="url(#tropGold)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M108 48 C130 50, 130 78, 104 82" stroke="url(#tropGold)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Cup Body -->
    <path d="M48 40 L112 40 C112 75, 96 95, 80 95 C64 95, 48 75, 48 40 Z" fill="url(#tropGold)"/>
    
    <!-- Cup Rim & Interior -->
    <ellipse cx="80" cy="40" rx="32" ry="7" fill="#FFF3E0"/>
    <ellipse cx="80" cy="40" rx="28" ry="5" fill="#C6283D"/>

    <!-- Khelo Star / Badge on Cup -->
    <polygon points="80,56 83,63 90,64 85,69 86,76 80,72 74,76 75,69 70,64 77,63" fill="#FFFFFF"/>
    
    <!-- Laurel ribbon / accent -->
    <path d="M60 88 C70 94, 90 94, 100 88" stroke="#FFE082" stroke-width="2" fill="none"/>
  </g>
</svg>

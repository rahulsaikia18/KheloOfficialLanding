<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="hostShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D64"/>
      <stop offset="50%" stop-color="#C6283D"/>
      <stop offset="100%" stop-color="#19191D"/>
    </linearGradient>
    <filter id="hostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#C6283D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#hostGlow)">
    <!-- Outer Shield -->
    <path d="M80 16 L128 32 C128 85, 106 122, 80 144 C54 122, 32 85, 32 32 Z" fill="#202028" stroke="#3A3A4A" stroke-width="2"/>
    <path d="M80 24 L120 38 C120 80, 102 114, 80 134 C58 114, 40 80, 40 38 Z" fill="url(#hostShieldGrad)" opacity="0.35"/>

    <!-- Bracket lines inside shield -->
    <!-- Top Host Crown -->
    <polygon points="80,42 86,52 94,46 92,60 68,60 66,46 74,52" fill="#FFE082"/>

    <!-- Tournament bracket tree iconography -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left branch -->
      <line x1="56" y1="74" x2="66" y2="74"/>
      <line x1="56" y1="92" x2="66" y2="92"/>
      <line x1="66" y1="74" x2="66" y2="92"/>
      <line x1="66" y1="83" x2="74" y2="83"/>

      <!-- Right branch -->
      <line x1="104" y1="74" x2="94" y2="74"/>
      <line x1="104" y1="92" x2="94" y2="92"/>
      <line x1="94" y1="74" x2="94" y2="92"/>
      <line x1="94" y1="83" x2="86" y2="83"/>

      <!-- Center node -->
      <line x1="80" y1="83" x2="80" y2="96"/>
    </g>

    <!-- Center Trophy icon -->
    <circle cx="80" cy="106" r="10" fill="#FF4D64"/>
    <polygon points="80,100 82,104 86,104 83,107 84,111 80,109 76,111 77,107 74,104 78,104" fill="#FFFFFF"/>
  </g>
</svg>

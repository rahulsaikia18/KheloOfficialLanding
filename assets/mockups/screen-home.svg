<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" fill="none">
  <defs>
    <linearGradient id="bgHome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6283D" />
      <stop offset="100%" stop-color="#730C1E" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282832" />
      <stop offset="100%" stop-color="#1E1E26" />
    </linearGradient>
  </defs>

  <!-- Screen Background -->
  <rect width="360" height="760" rx="32" fill="url(#bgHome)" />

  <!-- Status Bar -->
  <g fill="#A0A0AB" font-family="'Inter', sans-serif" font-size="11" font-weight="600">
    <text x="28" y="24">18:30</text>
    <circle cx="288" cy="20" r="3" fill="#A0A0AB"/>
    <path d="M302 16 L310 24 H294 Z" fill="#A0A0AB"/>
    <rect x="318" y="14" width="16" height="9" rx="2" stroke="#A0A0AB" stroke-width="1.5"/>
    <rect x="320" y="16" width="10" height="5" fill="#C6283D"/>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(20, 42)">
    <!-- Avatar -->
    <circle cx="20" cy="20" r="20" fill="#32323E" stroke="#C6283D" stroke-width="2"/>
    <text x="20" y="24" font-family="'Sora', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">KO</text>
    
    <!-- User Greeting -->
    <text x="50" y="15" font-family="'Inter'" font-size="11" fill="#888894">Welcome back,</text>
    <text x="50" y="32" font-family="'Sora'" font-weight="800" font-size="15" fill="#FFFFFF">ShadowSniper</text>

    <!-- Coin Balance Pill (Top Right) -->
    <g transform="translate(210, 6)">
      <rect x="0" y="0" width="110" height="30" rx="15" fill="#2A1B22" stroke="#C6283D" stroke-width="1"/>
      <circle cx="16" cy="15" r="9" fill="#FFB300"/>
      <text x="16" y="19" font-family="'Sora'" font-weight="900" font-size="11" fill="#1A1A1A" text-anchor="middle">K</text>
      <text x="32" y="20" font-family="'Inter'" font-weight="800" font-size="12" fill="#FFE082">2,450</text>
      <text x="76" y="20" font-family="'Inter'" font-weight="700" font-size="9" fill="#FF8A9B">KC</text>
    </g>
  </g>

  <!-- Hero Tournament Banner -->
  <g transform="translate(20, 100)">
    <rect width="320" height="150" rx="16" fill="url(#bannerGrad)"/>
    <circle cx="270" cy="75" r="65" fill="#FF4D64" opacity="0.2"/>
    
    <!-- Badge -->
    <rect x="16" y="16" width="86" height="20" rx="10" fill="#140206" opacity="0.6"/>
    <circle cx="26" cy="26" r="3" fill="#00E676"/>
    <text x="34" y="29.5" font-family="'Inter'" font-weight="700" font-size="9" fill="#FFFFFF">LIVE SQUAD</text>

    <text x="16" y="60" font-family="'Sora'" font-weight="800" font-size="18" fill="#FFFFFF">Apex Royale Cup</text>
    <text x="16" y="80" font-family="'Inter'" font-size="11" fill="#FCE9ED">Prize Pool: 10,000 Virtual Coins</text>
    
    <g transform="translate(16, 98)">
      <rect width="112" height="34" rx="17" fill="#FFFFFF"/>
      <text x="56" y="22" font-family="'Inter'" font-weight="800" font-size="11" fill="#991B32" text-anchor="middle">JOIN MATCH</text>
    </g>
    <text x="144" y="119" font-family="'Inter'" font-size="10" fill="#FFA3AF">Starts in 14m</text>
  </g>

  <!-- Category Filter Pills -->
  <g transform="translate(20, 268)">
    <rect x="0" y="0" width="70" height="30" rx="15" fill="#C6283D"/>
    <text x="35" y="19" font-family="'Inter'" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">All (18)</text>

    <rect x="80" y="0" width="80" height="30" rx="15" fill="#282832" stroke="#3A3A48"/>
    <text x="120" y="19" font-family="'Inter'" font-weight="600" font-size="11" fill="#B0B0BE" text-anchor="middle">Squad</text>

    <rect x="170" y="0" width="70" height="30" rx="15" fill="#282832" stroke="#3A3A48"/>
    <text x="205" y="19" font-family="'Inter'" font-weight="600" font-size="11" fill="#B0B0BE" text-anchor="middle">Duo</text>

    <rect x="250" y="0" width="70" height="30" rx="15" fill="#282832" stroke="#3A3A48"/>
    <text x="285" y="19" font-family="'Inter'" font-weight="600" font-size="11" fill="#B0B0BE" text-anchor="middle">Custom</text>
  </g>

  <!-- Tournaments List Section -->
  <g transform="translate(20, 316)">
    <text x="0" y="16" font-family="'Sora'" font-weight="800" font-size="15" fill="#FFFFFF">Popular Tournaments</text>
    <text x="280" y="16" font-family="'Inter'" font-weight="600" font-size="11" fill="#C6283D">See all</text>

    <!-- Tournament Card 1 -->
    <g transform="translate(0, 30)">
      <rect width="320" height="100" rx="14" fill="url(#cardGrad)" stroke="#353542"/>
      <circle cx="36" cy="36" r="20" fill="#3D1822"/>
      <polygon points="36,24 43,30 43,42 36,48 29,42 29,30" fill="#C6283D"/>
      
      <text x="68" y="30" font-family="'Sora'" font-weight="700" font-size="13" fill="#FFFFFF">Battle Arena Pro Series</text>
      <text x="68" y="47" font-family="'Inter'" font-size="10" fill="#888898">Map: Erangel • Mode: Squad TPP</text>
      
      <rect x="68" y="60" width="160" height="6" rx="3" fill="#3A3A48"/>
      <rect x="68" y="60" width="130" height="6" rx="3" fill="#C6283D"/>
      <text x="68" y="80" font-family="'Inter'" font-size="9" fill="#888898">Slots: <tspan fill="#FFFFFF" font-weight="700">78 / 100</tspan></text>

      <rect x="236" y="52" width="72" height="32" rx="16" fill="#C6283D"/>
      <text x="272" y="72" font-family="'Inter'" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">ENTER</text>
    </g>

    <!-- Tournament Card 2 -->
    <g transform="translate(0, 142)">
      <rect width="320" height="100" rx="14" fill="url(#cardGrad)" stroke="#353542"/>
      <circle cx="36" cy="36" r="20" fill="#1C2E28"/>
      <polygon points="36,24 43,30 43,42 36,48 29,42 29,30" fill="#00C853"/>
      
      <text x="68" y="30" font-family="'Sora'" font-weight="700" font-size="13" fill="#FFFFFF">Midnight Clash Solo</text>
      <text x="68" y="47" font-family="'Inter'" font-size="10" fill="#888898">Map: Sanhok • Mode: Solo FPP</text>
      
      <rect x="68" y="60" width="160" height="6" rx="3" fill="#3A3A48"/>
      <rect x="68" y="60" width="80" height="6" rx="3" fill="#00C853"/>
      <text x="68" y="80" font-family="'Inter'" font-size="9" fill="#888898">Slots: <tspan fill="#FFFFFF" font-weight="700">48 / 100</tspan></text>

      <rect x="236" y="52" width="72" height="32" rx="16" fill="#2E2E3A" stroke="#48485A"/>
      <text x="272" y="72" font-family="'Inter'" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">VIEW</text>
    </g>

    <!-- Tournament Card 3 -->
    <g transform="translate(0, 254)">
      <rect width="320" height="72" rx="14" fill="url(#cardGrad)" stroke="#353542"/>
      <circle cx="36" cy="36" r="18" fill="#382218"/>
      <polygon points="36,26 42,31 42,41 36,46 30,41 30,31" fill="#FF9100"/>
      <text x="68" y="32" font-family="'Sora'" font-weight="700" font-size="12" fill="#FFFFFF">Custom Clan Showdown</text>
      <text x="68" y="48" font-family="'Inter'" font-size="10" fill="#888898">Hosted by GhostSquad</text>
    </g>
  </g>

  <!-- Bottom App Navigation Bar -->
  <g transform="translate(0, 684)">
    <rect width="360" height="76" fill="#18181E" stroke="#2C2C36" stroke-width="1"/>
    
    <!-- Home (Active) -->
    <g transform="translate(42, 16)">
      <circle cx="12" cy="12" r="14" fill="#3A1720"/>
      <path d="M6 14 L12 8 L18 14 V19 H14 V15 H10 V19 H6 Z" fill="#C6283D"/>
      <text x="12" y="32" font-family="'Inter'" font-size="9" font-weight="700" fill="#C6283D" text-anchor="middle">Home</text>
    </g>

    <!-- Tournaments -->
    <g transform="translate(116, 16)">
      <polygon points="12,7 18,11 18,19 12,23 6,19 6,11" stroke="#888898" stroke-width="1.5" fill="none"/>
      <text x="12" y="32" font-family="'Inter'" font-size="9" font-weight="500" fill="#888898" text-anchor="middle">Matches</text>
    </g>

    <!-- Host '+' FAB in center -->
    <g transform="translate(180, 16)">
      <circle cx="0" cy="12" r="18" fill="#C6283D"/>
      <path d="M-6 12 H6 M0 6 V18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="0" y="32" font-family="'Inter'" font-size="9" font-weight="700" fill="#FFA3AF" text-anchor="middle">Host</text>
    </g>

    <!-- Khelo Coins -->
    <g transform="translate(244, 16)">
      <circle cx="12" cy="12" r="8" stroke="#888898" stroke-width="1.5" fill="none"/>
      <text x="12" y="15" font-family="'Inter'" font-size="8" font-weight="800" fill="#888898" text-anchor="middle">K</text>
      <text x="12" y="32" font-family="'Inter'" font-size="9" font-weight="500" fill="#888898" text-anchor="middle">Coins</text>
    </g>

    <!-- Profile -->
    <g transform="translate(306, 16)">
      <circle cx="12" cy="10" r="5" stroke="#888898" stroke-width="1.5" fill="none"/>
      <path d="M5 21 C5 17 8 16 12 16 C16 16 19 17 19 21" stroke="#888898" stroke-width="1.5" fill="none"/>
      <text x="12" y="32" font-family="'Inter'" font-size="9" font-weight="500" fill="#888898" text-anchor="middle">Profile</text>
    </g>
  </g>
</svg>
